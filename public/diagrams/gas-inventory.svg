<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 606" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Inventory in six jobs. Buying: your PC clicks with TryPurchase, the server makes the item in GrantItem with a new handle, your PC copies it in Client_ItemAdded and the widget picks a slot. Both machines keep a map of handle to item with the same handle numbers; only your PC knows slots. Using: pressing a key finds the handle in that slot and sends it with Server_ActivateItem, the server uses the item, and Client_ItemRemoved or a stack count update tells your PC.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<text x="28" y="30" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">BUYING</text>
<rect x="28" y="42" width="300" height="124" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="44" cy="62" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="44" y="66" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="67" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Click</text>
<text x="316" y="67" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="end">your PC</text>
<text x="42" y="92" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">TryPurchase</text>
<text x="42" y="110" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">souls? bought 3 already?</text>
<text x="42" y="128" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ Server_Purchase(Blood Serum)</text>
<rect x="400" y="42" width="300" height="124" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="416" cy="62" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="416" y="66" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">2</text>
<text x="434" y="67" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Make it</text>
<text x="688" y="67" font-size="10.5" fill="#d9a441" font-weight="600" text-anchor="end">server</text>
<text x="414" y="92" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">GrantItem</text>
<text x="414" y="110" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">stack exists → stack +1, same handle</text>
<text x="414" y="128" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">else CreateHandle → handle 9,</text>
<text x="414" y="146" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">new item, add it to the map as 9</text>
<rect x="772" y="42" width="300" height="124" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="788" cy="62" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="788" y="66" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">3</text>
<text x="806" y="67" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Show it</text>
<text x="1060" y="67" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="end">your PC</text>
<text x="786" y="92" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Client_ItemAdded(9, Blood Serum)</text>
<text x="786" y="110" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">own copy, stored under handle 9 too</text>
<text x="786" y="128" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">widget picks the first free slot</text>
<text x="786" y="146" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ ItemSlotChanged(9, slot 0)</text>
<path d="M330 104 L397 104" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="364.0" y="92" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="middle">Server RPC</text>
<path d="M702 104 L769 104" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="736.0" y="92" font-size="10.5" fill="#d9a441" font-weight="600" text-anchor="middle">Client RPC</text>
<rect x="28" y="204" width="480" height="126" rx="10" fill="rgba(255,255,255,0.015)" stroke="#d9a441" stroke-opacity="0.6"/>
<text x="44" y="228" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">SERVER'S INVENTORY MAP   TMap&lt;handle, item></text>
<text x="44" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">handle</text>
<text x="118" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">item</text>
<text x="358" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">slot on screen</text>
<rect x="40" y="254" width="456" height="22" rx="4" fill="#151922" stroke="#2c3340"/>
<text x="58" y="270" font-size="12" fill="#e9c46a" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">7</text>
<text x="118" y="270" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">Elixir ×1</text>
<text x="358" y="270" font-size="12" fill="#9aa3b2" font-weight="500" text-anchor="start">—</text>
<rect x="40" y="280" width="456" height="22" rx="4" fill="#151922" stroke="#2c3340"/>
<text x="58" y="296" font-size="12" fill="#e9c46a" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">9</text>
<text x="118" y="296" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">Blood Serum ×2</text>
<text x="358" y="296" font-size="12" fill="#9aa3b2" font-weight="500" text-anchor="start">—</text>
<rect x="592" y="204" width="480" height="126" rx="10" fill="rgba(255,255,255,0.015)" stroke="#5fa8ff" stroke-opacity="0.6"/>
<text x="608" y="228" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">YOUR PC'S INVENTORY MAP   same handles</text>
<text x="608" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">handle</text>
<text x="682" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">item</text>
<text x="922" y="250" font-size="10.5" fill="#9aa3b2" font-weight="600" text-anchor="start">slot on screen</text>
<rect x="604" y="254" width="456" height="22" rx="4" fill="#151922" stroke="#2c3340"/>
<text x="622" y="270" font-size="12" fill="#e9c46a" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">7</text>
<text x="682" y="270" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">Elixir ×1</text>
<text x="922" y="270" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">slot 1</text>
<rect x="604" y="280" width="456" height="22" rx="4" fill="#151922" stroke="#2c3340"/>
<text x="622" y="296" font-size="12" fill="#e9c46a" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">9</text>
<text x="682" y="296" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">Blood Serum ×2</text>
<text x="922" y="296" font-size="12" fill="#e6e8ee" font-weight="500" text-anchor="start">slot 0</text>
<text x="546" y="288" font-size="11" fill="#9aa3b2" font-weight="600" text-anchor="middle">handles</text>
<text x="546" y="304" font-size="11" fill="#9aa3b2" font-weight="600" text-anchor="middle">match</text>
<text x="550.0" y="370" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">The server only knows handles. The slot is a screen position chosen by your inventory widget, so the handle is the only name both machines share.</text>
<text x="28" y="420" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">USING</text>
<rect x="28" y="432" width="300" height="124" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="44" cy="452" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="44" y="456" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">4</text>
<text x="62" y="457" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Press 1</text>
<text x="316" y="457" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="end">your PC</text>
<text x="42" y="482" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">TryActivateItemInSlot(0)</text>
<text x="42" y="500" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">which item says slot 0? → handle 9</text>
<text x="42" y="518" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ Server_ActivateItem(9)</text>
<rect x="400" y="432" width="300" height="124" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="416" cy="452" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="416" y="456" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5</text>
<text x="434" y="457" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Use it</text>
<text x="688" y="457" font-size="10.5" fill="#d9a441" font-weight="600" text-anchor="end">server</text>
<text x="414" y="482" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Server_ActivateItem</text>
<text x="414" y="500" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">find handle 9 · on cooldown?</text>
<text x="414" y="518" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">ability (Nightflare) or</text>
<text x="414" y="536" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">ConsumeItem: buff, stack −1</text>
<rect x="772" y="432" width="300" height="124" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="788" cy="452" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="788" y="456" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="806" y="457" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Remove it</text>
<text x="1060" y="457" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="end">both</text>
<text x="786" y="482" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">stack 0 → remove handle 9 from the map</text>
<text x="786" y="500" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Client_ItemRemoved(9)</text>
<text x="786" y="518" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">your PC removes it, slot empties</text>
<text x="786" y="536" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">stack left → ItemStackCountChanged</text>
<path d="M330 494 L397 494" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="364.0" y="482" font-size="10.5" fill="#5fa8ff" font-weight="600" text-anchor="middle">Server RPC</text>
<path d="M702 494 L769 494" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="736.0" y="482" font-size="10.5" fill="#d9a441" font-weight="600" text-anchor="middle">Client RPC</text>
<text x="550.0" y="600" font-size="11.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">Six functions carry the whole flow: TryPurchase → GrantItem → Client_ItemAdded → TryActivateItemInSlot → Server_ActivateItem → Client_ItemRemoved</text>
</svg>