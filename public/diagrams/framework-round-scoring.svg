<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Round scoring in six numbered steps. 1: a round ends on a flag majority or all flags taken (OnFlagCapturedCallback) or the round timer, and each calls EndRound. 2: DetermineRoundWinner checks five rules in order: flags captured, territory on the remaining flag, total territory, kills this round, otherwise replay. 3 and 4: AwardRoundEndSouls adds the round win and pays souls. 5: EndRound checks for two wins. 6: EndMatch, or StartTransitionToShop for the next round.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<circle cx="30" cy="30" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="30" y="34" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1</text>
<text x="48" y="35" font-size="13.5" fill="#d9a441" font-weight="700" text-anchor="start">A round ends when…</text>
<rect x="20" y="52" width="190" height="72" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="115.0" y="75" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Majority captured</text>
<text x="115.0" y="94" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">OnFlagCapturedCallback</text>
<text x="115.0" y="112" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">2 of 3 flags</text>
<path d="M212 88 L262 228" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="20" y="142" width="190" height="72" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="115.0" y="165" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Every flag taken</text>
<text x="115.0" y="184" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">OnFlagCapturedCallback</text>
<text x="115.0" y="202" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">even flag counts, e.g. 2:2</text>
<path d="M212 178 L262 228" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="20" y="232" width="190" height="72" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="115.0" y="255" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">5 minutes run out</text>
<text x="115.0" y="274" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">round timer</text>
<text x="115.0" y="292" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">set in StartRound</text>
<path d="M212 268 L262 228" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="20" y="330" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">each one calls</text>
<text x="105" y="330" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">EndRound</text>
<circle cx="292" cy="30" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="292" y="34" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">2</text>
<text x="310" y="35" font-size="13" fill="#e9c46a" font-weight="600" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">DetermineRoundWinner</text>
<rect x="265" y="52" width="310" height="352" rx="10" fill="none" stroke="#d9a441"/>
<circle cx="292" cy="90" r="12" fill="none" stroke="#9aa3b2"/>
<text x="292" y="94.5" font-size="11.5" fill="#9aa3b2" font-weight="700" text-anchor="middle">A</text>
<text x="316" y="95" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">More flags captured</text>
<circle cx="292" cy="152" r="12" fill="none" stroke="#9aa3b2"/>
<text x="292" y="156.5" font-size="11.5" fill="#9aa3b2" font-weight="700" text-anchor="middle">B</text>
<text x="316" y="150" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">Tied: more territory on the</text>
<text x="316" y="168" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">remaining flag</text>
<circle cx="292" cy="214" r="12" fill="none" stroke="#9aa3b2"/>
<text x="292" y="218.5" font-size="11.5" fill="#9aa3b2" font-weight="700" text-anchor="middle">C</text>
<text x="316" y="219" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">No captures: more total territory</text>
<circle cx="292" cy="276" r="12" fill="none" stroke="#9aa3b2"/>
<text x="292" y="280.5" font-size="11.5" fill="#9aa3b2" font-weight="700" text-anchor="middle">D</text>
<text x="316" y="274" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">Still level: more kills this round</text>
<text x="316" y="292" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">counted by ReportKill</text>
<circle cx="292" cy="338" r="12" fill="none" stroke="#9aa3b2"/>
<text x="292" y="342.5" font-size="11.5" fill="#9aa3b2" font-weight="700" text-anchor="middle">E</text>
<text x="316" y="343" font-size="13.5" fill="#9aa3b2" font-weight="500" text-anchor="start">Dead even: replay the round</text>
<text x="420" y="394" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">stops at the first rule that separates the teams</text>
<path d="M577 228 L632 228" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="760" y="35" font-size="13.5" fill="#d9a441" font-weight="700" text-anchor="middle">Then the server…</text>
<rect x="635" y="52" width="270" height="72" rx="8" fill="#151922" stroke="#2c3340"/>
<circle cx="651" cy="70" r="10" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="651" y="74" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">3</text>
<text x="779.0" y="75" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Adds a round win</text>
<text x="770.0" y="94" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">AwardRoundEndSouls</text>
<text x="770.0" y="112" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">none on a draw</text>
<rect x="635" y="142" width="270" height="72" rx="8" fill="#151922" stroke="#2c3340"/>
<circle cx="651" cy="160" r="10" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="651" y="164" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">4</text>
<text x="779.0" y="165" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Pays souls</text>
<text x="770.0" y="184" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">AwardRoundEndSouls</text>
<text x="770.0" y="202" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">loser 100 · winner 50 · draw 100 each</text>
<rect x="635" y="232" width="270" height="72" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="651" cy="250" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="651" y="254" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5</text>
<text x="779.0" y="255" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Checks for 2 wins</text>
<text x="770.0" y="274" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">EndRound</text>
<text x="770.0" y="292" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">first to two takes the match</text>
<path d="M770 126 L770 140" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M770 216 L770 230" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="635" y="340" width="130" height="66" rx="8" fill="#151922" stroke="#d9822b"/>
<circle cx="651" cy="358" r="10" fill="none" stroke="#d9822b" stroke-width="1.5"/>
<text x="651" y="362" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="709.0" y="363" font-size="13" fill="#e6e8ee" font-weight="600" text-anchor="middle">MatchOver</text>
<text x="700.0" y="382" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">EndMatch</text>
<rect x="775" y="340" width="130" height="66" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="791" cy="358" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="791" y="362" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="849.0" y="363" font-size="13" fill="#e6e8ee" font-weight="600" text-anchor="middle">Shop</text>
<text x="840.0" y="382" font-size="9.36768149882904" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">StartTransitionToShop</text>
<path d="M730 306 L702 338" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<path d="M810 306 L838 338" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="680" y="328" font-size="12" fill="#d9822b" font-weight="600" text-anchor="middle">yes</text>
<text x="850" y="328" font-size="12" fill="#d9a441" font-weight="600" text-anchor="middle">no</text>
</svg>