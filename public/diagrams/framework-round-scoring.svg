<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 410" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="A round ends on a flag majority, all flags captured, or the timer. DetermineRoundWinner checks five rules in order. The server then pays souls, adds a round win, and either ends the match at two wins or moves to the shop.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker></defs>
<text x="110" y="26" font-size="13.5" fill="#d9a441" font-weight="700" text-anchor="middle">A round ends when…</text>
<rect x="20" y="44" width="180" height="66" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="110.0" y="73.0" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">A team takes the majority</text>
<text x="110.0" y="93.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">2 of 3 flags</text>
<path d="M202 77 L262 210" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="20" y="130" width="180" height="66" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="110.0" y="159.0" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Every flag is taken</text>
<text x="110.0" y="179.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">even flag counts, e.g. 2:2</text>
<path d="M202 163 L262 210" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="20" y="216" width="180" height="66" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="110.0" y="245.0" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">5 minutes run out</text>
<text x="110.0" y="265.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">round timer</text>
<path d="M202 249 L262 210" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="420" y="26" font-size="13.5" fill="#d9a441" font-weight="700" text-anchor="middle">DetermineRoundWinner</text>
<rect x="265" y="44" width="310" height="345" rx="10" fill="none" stroke="#d9a441"/>
<circle cx="292" cy="82" r="13" fill="none" stroke="#d9a441"/>
<text x="292" y="87" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="middle">1</text>
<text x="318" y="87" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">More flags captured</text>
<circle cx="292" cy="142" r="13" fill="none" stroke="#d9a441"/>
<text x="292" y="147" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="middle">2</text>
<text x="318" y="140" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">Tied: more territory on the</text>
<text x="318" y="158" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">remaining flag</text>
<circle cx="292" cy="202" r="13" fill="none" stroke="#d9a441"/>
<text x="292" y="207" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="middle">3</text>
<text x="318" y="207" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">No captures: more total territory</text>
<circle cx="292" cy="262" r="13" fill="none" stroke="#d9a441"/>
<text x="292" y="267" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="middle">4</text>
<text x="318" y="267" font-size="13.5" fill="#e6e8ee" font-weight="500" text-anchor="start">Still level: more kills this round</text>
<circle cx="292" cy="322" r="13" fill="none" stroke="#d9a441"/>
<text x="292" y="327" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="middle">5</text>
<text x="318" y="327" font-size="13.5" fill="#9aa3b2" font-weight="500" text-anchor="start">Dead even: replay the round</text>
<text x="420" y="378" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">stops at the first rule that separates the teams</text>
<path d="M577 200 L632 200" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="760" y="26" font-size="13.5" fill="#d9a441" font-weight="700" text-anchor="middle">Then the server…</text>
<rect x="635" y="44" width="250" height="70" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="760.0" y="75.0" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Pays souls</text>
<text x="760.0" y="95.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">loser 100 · winner 50 · draw 100 each</text>
<rect x="635" y="134" width="250" height="70" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="760.0" y="165.0" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Adds a round win</text>
<text x="760.0" y="185.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">none on a draw</text>
<rect x="635" y="224" width="250" height="70" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="760.0" y="255.0" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Checks for 2 wins</text>
<text x="760.0" y="275.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">first to two takes the match</text>
<path d="M760 116 L760 132" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M760 206 L760 222" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="635" y="330" width="115" height="62" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="692.5" y="357.0" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">MatchOver</text>
<text x="692.5" y="377.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">stats sent</text>
<rect x="770" y="330" width="115" height="62" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="827.5" y="357.0" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Shop</text>
<text x="827.5" y="377.0" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">next round</text>
<path d="M720 296 L692 328" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<path d="M800 296 L828 328" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="668" y="318" font-size="12" fill="#d9822b" font-weight="600" text-anchor="middle">yes</text>
<text x="838" y="318" font-size="12" fill="#d9a441" font-weight="600" text-anchor="middle">no</text>
</svg>