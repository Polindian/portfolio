<text x="390.0" y="100" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">RecalculateCaptureRates</text>
<text x="390.0" y="119" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">hero 3 (+ Dominion), minion 1</text>
