<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Flag capture. On the server every frame: track who is in the zone, add up team rates with hero and minion weights, move capture progress by the net rate, and at 100 percent announce the capture to the Game Mode. Heroes in the zone earn XP. The flag replicates to every player, whose PCs show zone gauges, a tug-of-war bar and the banner.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
<rect x="10" y="20" width="1030" height="250" rx="12" fill="rgba(217,164,65,0.04)" stroke="rgba(217,164,65,0.35)"/>
<text x="30" y="46" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">ON THE SERVER, EVERY FRAME OF A ROUND</text>
<rect x="40" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="140.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Who is in the zone</text>
<text x="140.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">overlap enter / exit</text>
<text x="140.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">all influencers + heroes</text>
<rect x="290" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="390.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Team rates</text>
<text x="390.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">hero 3 (+ Dominion), minion 1</text>
<text x="390.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">skip dead · drop destroyed</text>
<rect x="540" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="640.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Capture progress</text>
<text x="640.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">net rate × DeltaTime</text>
<text x="640.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">drain, flip, carry over</text>
<rect x="790" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="890.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Captured at 100%</text>
<text x="890.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">OnFlagCaptured → Game Mode</text>
<text x="890.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">banner slams team colour</text>
<path d="M242 105.0 L287 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M492 105.0 L537 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M742 105.0 L787 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="290" y="176" width="200" height="78" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="390.0" y="202" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Zone rewards</text>
<text x="390.0" y="223" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">50 XP per 8s in any zone</text>
<text x="390.0" y="240" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">capture time for match stats</text>
<path d="M140.0 146 L140.0 215.0 L287 215.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="150.0" y="207.0" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">heroes only</text>
<rect x="790" y="176" width="200" height="78" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="890.0" y="202" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Majority check</text>
<text x="890.0" y="223" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">Game Mode recounts</text>
<text x="890.0" y="240" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">every flag (Rounds)</text>
<path d="M890.0 146 L890.0 173" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<path d="M525 272 L525 324" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="540" y="293" font-size="12" fill="#5fa8ff" font-weight="600" text-anchor="start">replicated to every player, near or far (bAlwaysRelevant)</text>
<text x="540" y="311" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">percent · owner · team rates · captured · banner</text>
<rect x="10" y="328" width="1030" height="160" rx="12" fill="rgba(95,168,255,0.04)" stroke="rgba(95,168,255,0.35)"/>
<text x="30" y="352" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">ON EACH PLAYER'S PC</text>
<rect x="40" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="140.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Zone gauges (top right)</text>
<text x="140.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">capture percent + owner</text>
<text x="140.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">smoothed with FInterpTo</text>
<rect x="290" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="390.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Tug-of-war bar</text>
<text x="390.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">red rate vs blue rate</text>
<text x="390.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">shown only while you are in a zone</text>
<rect x="540" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="640.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Banner</text>
<text x="640.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">OnRep_BannerState</text>
<text x="640.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">colour slam on capture</text>
<text x="800" y="394" font-size="12" fill="#9aa3b2" font-weight="600" text-anchor="start">The PC never decides anything:</text>
<text x="800" y="414" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">it only shows what the server</text>
<text x="800" y="432" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">sent, and checks its own</text>
<text x="800" y="450" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">distance to show the bar.</text>
</svg>