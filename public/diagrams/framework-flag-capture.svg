<text x="802" y="432" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">sent, and checks its own</text>
<text x="802" y="450" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">distance to show the bar.</text>
