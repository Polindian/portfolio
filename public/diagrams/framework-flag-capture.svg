<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Flag capture in nine numbered steps. On the server every frame: 1 OnInfluencerEnter and Exit track who is in the zone, 2 RecalculateCaptureRates adds up team weights, 3 Tick moves capture progress, 4 at 100 percent OnFlagCaptured tells the Game Mode, 5 Tick also gives heroes in the zone XP and capture time, 6 OnFlagCapturedCallback recounts every flag. The flag replicates to every player, whose PCs show 7 the zone gauges, 8 the tug-of-war bar and 9 the banner. The table below lists every function.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
