<text x="540" y="293" font-size="12" fill="#5fa8ff" font-weight="600" text-anchor="start">replicated to every player, near or far (bAlwaysRelevant)</text>
<text x="540" y="311" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">percent · owner · team rates · captured · banner</text>
<rect x="8" y="328" width="1034" height="160" rx="12" fill="rgba(95,168,255,0.04)" stroke="rgba(95,168,255,0.35)"/>
