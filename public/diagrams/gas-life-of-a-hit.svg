<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 452" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="The life of a hit in five stages, each condition coloured by the section that controls it. 1 Can I attack: weapon equipped tag, cost and cooldown, not stunned, combo window. 2 Where does it hit: melee socket sweep, projectiles and radius sweeps, hostile targets only, each hit once. 3 How hard: damage effect and MMC reading Attack Damage, stats and ability level, skill tree buffs, damage effect per combo section. 4 How much is taken: Armour, Loaded Dice, Health clamped. 5 What happens next: knockback and death abilities, souls and XP for the killer, which buy items and raise the level.">
