<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Match phases: waiting for players, loading hold, then a loop of round intro, countdown, in round, round end, transition to shop, shop, transition to arena and back to round intro, until a team has two round wins and the match ends.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker></defs>
<rect x="20" y="20" width="170" height="76" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="105.0" y="51" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">WaitingForPlayers</text>
<text x="105.0" y="72" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">until everyone joins</text>
<rect x="225" y="20" width="170" height="76" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="310.0" y="51" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Loading hold</text>
<text x="310.0" y="72" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">all loaded + 15s, or 25s</text>
<rect x="430" y="20" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="515.0" y="51" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">RoundIntro</text>
<text x="515.0" y="72" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">round banner</text>
<rect x="635" y="20" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="720.0" y="51" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Countdown</text>
<text x="720.0" y="72" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">5…1 · input locked</text>
<rect x="840" y="20" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="925.0" y="51" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">InRound</text>
<text x="925.0" y="72" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">60s or flag majority</text>
<rect x="840" y="220" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="925.0" y="251" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">RoundEnd</text>
<text x="925.0" y="272" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">winner · souls paid</text>
<rect x="635" y="220" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="720.0" y="251" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">TransitionToShop</text>
<text x="720.0" y="272" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">fade to black</text>
<rect x="430" y="220" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="515.0" y="251" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">ShopPhase</text>
<text x="515.0" y="272" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">60s or all Continue</text>
<rect x="225" y="220" width="170" height="76" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="310.0" y="251" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">TransitionToArena</text>
<text x="310.0" y="272" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">fade back in</text>
<rect x="840" y="350" width="170" height="76" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="925.0" y="381" font-size="14.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">MatchOver</text>
<text x="925.0" y="402" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">stats → leaderboard</text>
<path d="M192 58.0 L222 58.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M397 58.0 L427 58.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M602 58.0 L632 58.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M807 58.0 L837 58.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M925.0 98 L925.0 217" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M838 258.0 L808 258.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M633 258.0 L603 258.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M428 258.0 L398 258.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M310.0 218 L310.0 160 L515.0 160 L515.0 99" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="412.5" y="152" font-size="12" fill="#d9a441" font-weight="600" text-anchor="middle">next round</text>
<path d="M925.0 298 L925.0 347" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<text x="830" y="330" font-size="12" fill="#d9822b" font-weight="600" text-anchor="end">a team has 2 round wins</text>
<text x="20" y="372" font-size="12.5" fill="#d9a441" font-weight="600" text-anchor="start">Gold boxes: the round loop, repeated every round.</text>
<text x="20" y="394" font-size="12.5" fill="#9aa3b2" font-weight="400" text-anchor="start">Every arrow is a timer firing or a game event</text>
<text x="20" y="414" font-size="12.5" fill="#9aa3b2" font-weight="400" text-anchor="start">(players loading, flag capture, Continue votes).</text>
</svg>