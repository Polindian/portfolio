<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="The combat loop in six steps: an ability starts, a hit is found, the damage is worked out, death, stun and knockback follow, rewards pay souls and XP, and growth through levelling, the shop and skill trees makes the next hit stronger, which loops back to the ability. Around it sit the gameplay framework, networking, the UI, the skeleton AI and audio.">
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<rect x="20" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#5fa8ff"/>
<text x="100.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Ability</text>
<text x="100.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">GAS foundations,</text>
<text x="100.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">weapon equip</text>
<path d="M182 118 L200 118" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#hd)"/>
<rect x="204" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#b08cff"/>
<text x="284.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Hit</text>
<text x="284.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">melee sweep,</text>
<text x="284.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">ranged &amp; area</text>
<path d="M366 118 L384 118" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#hd)"/>
<rect x="388" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#d9a441"/>
<text x="468.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Damage</text>
<text x="468.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">MMC, then the</text>
<text x="468.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">attribute set</text>
<path d="M550 118 L568 118" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#hd)"/>
<rect x="572" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#e5636b"/>
<text x="652.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Death</text>
<text x="652.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">tags, respawn,</text>
<text x="652.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">stun, knockback</text>
<path d="M734 118 L752 118" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#hd)"/>
<rect x="756" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#4fc1b0"/>
<text x="836.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Rewards</text>
<text x="836.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">souls and XP,</text>
<text x="836.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">shared nearby</text>
<path d="M918 118 L936 118" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#hd)"/>
<rect x="940" y="70" width="160" height="96" rx="10" fill="#151922" stroke="#6cc070"/>
<text x="1020.0" y="100" font-size="15" fill="#e6e8ee" font-weight="700" text-anchor="middle">Growth</text>
<text x="1020.0" y="126" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">levelling, shop,</text>
<text x="1020.0" y="144" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">skill trees</text>
<path d="M1020.0 168 L1020.0 210 L100.0 210 L100.0 172" fill="none" stroke="#6cc070" stroke-width="2" marker-end="url(#hd)"/>
<text x="550.0" y="202" font-size="12.5" fill="#6cc070" font-weight="600" text-anchor="middle">stronger stats, higher ability levels and new skills feed the next hit</text>
<text x="550.0" y="36" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">Every fight runs the same loop, and each step is a section on this page</text>
<text x="550.0" y="270" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">Around the loop: the gameplay framework (rounds, scoring, match stats), the server deciding and replicating,</text>
<text x="550.0" y="290" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="middle">the UI reading attributes and tags, the skeleton AI using the same abilities, and audio driven by tags.</text>
</svg>