<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 832" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="A melee combo in seven numbered steps. On the attacker's PC and the server: a key press starts the ability, which commits, slows the hero and plays the montage. On every machine the montage's AN_SendTargetGroup notify sweeps between sword sockets, skips the attacker, anyone already hit and anyone not hostile, plays local sparks and sends the hits in a gameplay event, even with no hits. On the server, StartCombo handles the first hit and starts the combo listeners; the combo window notify sets the next section when the right button is pressed in time; later hits arrive on ability.combo.damage. Every hit applies a damage effect with a spec and a context holding the hit. The table below lists every function.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker><marker id="hb08cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b08cff"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<rect x="10" y="14" width="1080" height="190" rx="12" fill="rgba(255,255,255,0.015)" stroke="#5fa8ff" stroke-opacity="0.45"/>
<text x="28" y="38" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">ON THE ATTACKER'S PC (PREDICTED) AND THE SERVER</text>
<rect x="28" y="48" width="320" height="142" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="44" cy="68" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="44" y="72" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="73" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Press attack</text>
<text x="42" y="96" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">HandleAbilityInput</text>
<text x="42" y="114" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AbilityLocalInputPressed(InputID)</text>
<text x="42" y="132" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">starts the ability given with that button</text>
<text x="42" y="150" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">+ SendGameplayEventToActor (local)</text>
<text x="42" y="168" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">+ Server_SendGameplayEventToSelf</text>
<rect x="376" y="48" width="330" height="142" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="392" cy="68" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="392" y="72" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">2</text>
<text x="410" y="73" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Start the swing</text>
<text x="390" y="96" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">ActivateAbility</text>
<text x="390" y="114" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">K2_CommitAbility (cost, cooldown)</text>
<text x="390" y="132" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">walk speed 50 + SpeedOverride tag</text>
<text x="390" y="150" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">PlayMontageAndWait (first section)</text>
<text x="390" y="168" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">WaitGameplayEvent listeners</text>
<rect x="734" y="48" width="338" height="142" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="750" cy="68" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="750" y="72" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5</text>
<text x="768" y="73" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Combo window</text>
<text x="748" y="96" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AN_SendGameplayEvent</text>
<text x="748" y="114" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">change.combo02 → NextComboName (open)</text>
<text x="748" y="132" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">change.end → NAME_None (closed)</text>
<text x="748" y="150" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">press in window + right button (ComboInputMap)</text>
<text x="748" y="168" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Montage_SetNextSection → back to 3</text>
<path d="M350 119 L374 119" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<rect x="10" y="232" width="1080" height="146" rx="12" fill="rgba(255,255,255,0.015)" stroke="#b08cff" stroke-opacity="0.45"/>
<text x="28" y="256" font-size="12.5" fill="#b08cff" font-weight="700" text-anchor="start">ON EVERY MACHINE (THE MONTAGE IS REPLICATED)</text>
<rect x="28" y="262" width="1044" height="106" rx="8" fill="#151922" stroke="#b08cff"/>
<circle cx="44" cy="282" r="10" fill="none" stroke="#b08cff" stroke-width="1.5"/>
<text x="44" y="286" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">3</text>
<text x="62" y="287" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Sweep the sword: AN_SendTargetGroup::Notify</text>
<text x="42" y="310" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">SphereTraceMultiForObjects from socket to socket, on one frame · radius 35 (or an attribute for smash / stun)</text>
<text x="42" y="328" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">skip yourself · anyone already hit (TSet HitActors) · anyone not Hostile (GetTeamAttitudeTowards)</text>
<text x="42" y="346" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">local gameplay cue → hit sparks on every machine, nothing sent over the network</text>
<text x="1058" y="336" font-size="11.5" fill="#e9c46a" font-weight="500" text-anchor="end">SendGameplayEventToActor(hits): sent once,</text>
<text x="1058" y="354" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="end">even with 0 hits, so a missed swing still combos</text>
<path d="M541 192 L541 260" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="550" y="222" font-size="11" fill="#9aa3b2" font-weight="600" text-anchor="start">montage plays everywhere</text>
<rect x="10" y="406" width="1080" height="276" rx="12" fill="rgba(255,255,255,0.015)" stroke="#d9a441" stroke-opacity="0.45"/>
<text x="28" y="430" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">ON THE SERVER (ONLY THE SERVER LISTENS FOR HITS)</text>
<rect x="28" y="440" width="520" height="120" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="44" cy="460" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="44" y="464" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">4</text>
<text x="62" y="465" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">First hit: StartCombo</text>
<text x="42" y="488" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">on ability.stab.right</text>
<text x="42" y="506" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">push (if set) + ApplyGameplayEffectToHitResultActor</text>
<text x="42" y="524" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">also starts the combo listeners on both machines → 5</text>
<rect x="576" y="440" width="496" height="120" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="592" cy="460" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="592" y="464" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="610" y="465" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Later hits</text>
<text x="590" y="488" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">on ability.combo.damage</text>
<text x="590" y="506" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">HandleComboDamageEvent (Stab) · DoDamage (GA_Combo)</text>
<text x="590" y="524" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">ComboDamageMap: damage effect + push for this section</text>
<text x="590" y="542" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">push + ApplyGameplayEffectToHitResultActor</text>
<path d="M430 370 L430 438" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="438" y="398" font-size="11" fill="#d9a441" font-weight="600" text-anchor="start">ability.stab.right + hits</text>
<path d="M824 370 L824 438" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<text x="832" y="398" font-size="11" fill="#d9a441" font-weight="600" text-anchor="start">ability.combo.damage + hits</text>
<rect x="28" y="590" width="1044" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="44" cy="610" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="44" y="614" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">7</text>
<text x="62" y="615" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Apply the damage effect: ApplyGameplayEffectToHitResultActor</text>
<text x="42" y="638" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">MakeOutgoingGameplayEffectSpec (effect + level) → MakeEffectContext + AddHitResult (who, which ability, where) → SetContext</text>
<text x="42" y="656" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ ApplyGameplayEffectSpecToTarget: the enemy's ASC runs the effect (the damage pipeline)</text>
<path d="M288 562 L288 588" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<path d="M824 562 L824 588" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<rect x="10" y="700" width="1080" height="118" rx="12" fill="rgba(255,255,255,0.015)" stroke="#d9822b" stroke-opacity="0.45"/>
<text x="28" y="724" font-size="12.5" fill="#d9822b" font-weight="700" text-anchor="start">LINKS TO OTHER SECTIONS</text>
<rect x="28" y="734" width="520" height="72" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="42" y="759" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Comes in from</text>
<text x="42" y="782" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">Weapon equip: attacks need the stats.weapon.equipped tag · GAS foundations: input IDs</text>
<text x="42" y="800" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">from GiveAbility (1) · Attributes &amp; levelling: ability level → effect level (7)</text>
<rect x="576" y="734" width="496" height="72" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="590" y="759" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Goes out to</text>
<text x="590" y="782" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">Damage pipeline: the MMC turns Attack Damage and Armour into damage (7)</text>
<text x="590" y="800" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">Knockback: PushTarget → GAP_Launched · Ranged &amp; area: same flow (3)</text>
</svg>