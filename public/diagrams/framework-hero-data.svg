<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Hero data. In the lobby each PC finds the hero data assets by type, loads them in the background to build the hero list, preloads everything heroes show in one batch, and sends the pick to the server. Hovering is instant because assets are already loaded. When everyone locks in or the timer ends, anyone without a hero gets a random one. Seamless travel carries the pick to the arena, where the server chooses and loads the hero class, spawns it with a team and start spot, and initialises it on the server and owning client.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
<rect x="10" y="20" width="1030" height="250" rx="12" fill="rgba(217,164,65,0.04)" stroke="rgba(217,164,65,0.35)"/>
<text x="30" y="46" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">IN THE LOBBY</text>
<rect x="40" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="140.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Hero data assets</text>
<text x="140.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">one per hero, soft pointers</text>
<text x="140.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">found by type, not loaded</text>
<rect x="290" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="390.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Hero list</text>
<text x="390.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">load definitions async</text>
<text x="390.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">one tile per hero</text>
<rect x="540" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="640.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Preload batch</text>
<text x="640.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">everything a hero shows</text>
<text x="640.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">one async load, handle kept</text>
<rect x="790" y="66" width="200" height="78" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="890.0" y="92" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Pick a hero</text>
<text x="890.0" y="113" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">Server RPC → Game State</text>
<text x="890.0" y="130" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">shown in every team slot</text>
<path d="M242 105.0 L287 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M492 105.0 L537 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M742 105.0 L787 105.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="540" y="176" width="200" height="78" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="640.0" y="202" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Hover or preview</text>
<text x="640.0" y="223" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">LoadSynchronous finds it</text>
<text x="640.0" y="240" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">already in memory: instant</text>
<path d="M640.0 146 L640.0 173" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="790" y="176" width="200" height="78" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="890.0" y="202" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Everyone locked in</text>
<text x="890.0" y="223" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">or the timer ends: random</text>
<text x="890.0" y="240" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">hero for anyone without one</text>
<path d="M890.0 146 L890.0 173" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<path d="M525 272 L525 324" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="540" y="293" font-size="12" fill="#5fa8ff" font-weight="600" text-anchor="start">seamless travel to the arena</text>
<text x="540" y="311" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">CopyProperties carries the pick to the new Player State</text>
<rect x="10" y="328" width="1030" height="160" rx="12" fill="rgba(95,168,255,0.04)" stroke="rgba(95,168,255,0.35)"/>
<text x="30" y="352" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">IN THE ARENA, ON THE SERVER</text>
<rect x="40" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="140.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Choose the class</text>
<text x="140.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">from the Player State's pick</text>
<text x="140.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">fallback if none</text>
<rect x="290" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="390.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Load the class</text>
<text x="390.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">LoadSynchronous, safe here:</text>
<text x="390.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">behind the loading screen</text>
<rect x="540" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="640.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Spawn the hero</text>
<text x="640.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">team ID + start spot</text>
<text x="640.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">Blueprint hero class</text>
<rect x="790" y="370" width="200" height="78" rx="8" fill="#151922" stroke="#5fa8ff"/>
<text x="890.0" y="396" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="middle">Initialise</text>
<text x="890.0" y="417" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">abilities set up on the</text>
<text x="890.0" y="434" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">server and owning client</text>
<path d="M242 409.0 L287 409.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<path d="M492 409.0 L537 409.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<path d="M742 409.0 L787 409.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
</svg>