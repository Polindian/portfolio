<text x="860" y="97" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="start">Come back</text>
<text x="840" y="120" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">DeathTagUpdated(0) → Respawn</text>
<text x="840" y="138" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">everything from step 2 undone</text>
<text x="840" y="156" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">swords away, StartSpot (server)</text>
<text x="840" y="174" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">ApplyFullStatEffect</text>
<text x="840" y="192" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">cooldowns kept</text>
