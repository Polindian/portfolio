<text x="308" y="174" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">montage, unseen by AI, dissolve</text>
<text x="308" y="192" font-size="11.5" fill="#d9822b" font-weight="400" text-anchor="start">banner and death sound</text>
