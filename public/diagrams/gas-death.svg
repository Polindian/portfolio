<text x="574" y="366" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">allies: 50% killer, 50% split</text>
<text x="574" y="384" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">between friendly heroes nearby</text>
