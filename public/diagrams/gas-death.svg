<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 916" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Death, rewards, stun and knockback in twelve numbered steps, coloured by the machine that runs them. Death and respawn: 1, on the server HealthUpdated at zero applies the death effect, which grants the dead tag, and sends the dead event with the killing blow's context; 2, the dead tag replicates, so DeathTagUpdated runs StartDeathSequence on every machine, turning input off, cancelling abilities, playing the montage, hiding the hero from AI and dissolving the body, while the banner and death sound play only on the dying player's screen; 3, when the montage ends the capsule stops blocking others and the server starts the respawn timer, which removes the death effect; 4, the tag's removal runs Respawn on every machine, resetting the hero at their start spot with full stats. Rewards, in UGAP_Dead on the server: 5, the killer comes from the context and only heroes get credit; 6, the amount depends on whether a hero or skeleton died, and Stacked Odds can double it; 7, the killer gets everything alone, or half with the rest split between friendly heroes nearby; 8, a reward effect fills in XP and souls with SetByCaller and the kill is reported to the Game Mode. Stun and fall back: 9, the tag plays a montage, turns a player's input off and blocks abilities; 10, a skeleton's behaviour tree pauses. Knockback: 11, PushTarget stores the velocity in a hit result and sends the target a launch event; 12, the target's UGAP_Launched commits and launches itself, and the movement replicates. Links: the damage pipeline and the attacks feed in; levelling, the shop and the framework read from it.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="h4fc1b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fc1b0"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
