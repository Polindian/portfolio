<text x="574" y="156" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">server: RespawnDelay timer</text>
<text x="574" y="174" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ RespawnImmediately</text>
<text x="574" y="192" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">removes the death effect</text>
<rect x="826" y="72" width="246" height="138" rx="8" fill="#151922" stroke="#b08cff" stroke-opacity="1"/>
<circle cx="842" cy="92" r="10" fill="none" stroke="#b08cff" stroke-width="1.5"/>
