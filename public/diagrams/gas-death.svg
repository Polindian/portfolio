<circle cx="44" cy="92" r="10" fill="none" stroke="#4fc1b0" stroke-width="1.5"/>
<text x="44" y="96" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="97" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="start">Health reaches 0</text>
