<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Player controller inheritance: menu and lobby controllers share AMenuPlayerController; the arena controller inherits directly from APlayerController">
<defs><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker></defs>
<rect x="400" y="20" width="240" height="62" rx="8" fill="#151922" stroke="#d9a441"/>
<text x="520.0" y="45" font-size="15" fill="#e6e8ee" font-weight="600" text-anchor="middle">APlayerController</text>
<text x="520.0" y="65" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">Unreal's base class</text>
<rect x="160" y="120" width="260" height="62" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="290.0" y="145" font-size="15" fill="#e6e8ee" font-weight="600" text-anchor="middle">AMenuPlayerController</text>
<text x="290.0" y="165" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">cursor + spawns menu widget</text>
<rect x="640" y="120" width="260" height="62" rx="8" fill="#151922" stroke="#d9822b"/>
<text x="770.0" y="145" font-size="15" fill="#e6e8ee" font-weight="600" text-anchor="middle">AChrisPlayerController</text>
<text x="770.0" y="165" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">arena: HUD, input, round RPCs</text>
<rect x="20" y="222" width="260" height="62" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="150.0" y="247" font-size="15" fill="#e6e8ee" font-weight="600" text-anchor="middle">AMainMenuPlayerController</text>
<text x="150.0" y="267" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">+ menu music</text>
<rect x="300" y="222" width="260" height="62" rx="8" fill="#151922" stroke="#2c3340"/>
<text x="430.0" y="247" font-size="15" fill="#e6e8ee" font-weight="600" text-anchor="middle">ALobbyPlayerController</text>
<text x="430.0" y="267" font-size="13" fill="#9aa3b2" font-weight="400" text-anchor="middle">+ slot / ready / hero RPCs</text>
<line x1="290" y1="120" x2="470" y2="84" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<line x1="770" y1="120" x2="570" y2="84" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<line x1="150" y1="222" x2="250" y2="184" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<line x1="430" y1="222" x2="330" y2="184" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="780" y="262" font-size="12.5" fill="#9aa3b2" font-weight="400" text-anchor="middle">Arrows point to the parent class</text>
</svg>