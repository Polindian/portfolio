<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Levelling in numbered steps. Once at setup, the ASC subscribes ExperienceUpdated to Experience changes and InitializeBaseAttributes sets level 1. On the server, kills (GAP_Dead) and flag zones (AFlag Tick) add XP, ExperienceUpdated works out the level and upgrade points, and MMC_LevelBased grows stats with level. The owning client sees the values by replication and asks Server_UpgradeAbilityWithID to spend points; the server answers with Client_AbilitySpecLevelUpdated. The table below lists every function.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="hd9822b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<rect x="10" y="14" width="1080" height="140" rx="12" fill="rgba(255,255,255,0.015)" stroke="#9aa3b2" stroke-opacity="0.45"/>
<text x="28" y="38" font-size="12.5" fill="#9aa3b2" font-weight="700" text-anchor="start">ONCE, WHEN THE HERO IS SET UP (server)</text>
<rect x="28" y="48" width="500" height="96" rx="8" fill="#151922" stroke="#2c3340"/>
<circle cx="44" cy="68" r="10" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="44" y="72" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">A</text>
<text x="62" y="73" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Subscribe</text>
<text x="42" y="96" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">ASC constructor:</text>
<text x="42" y="114" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">…ExperienceAttribute()).AddUObject(this, &amp;…::ExperienceUpdated)</text>
<text x="42" y="132" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">"call ExperienceUpdated whenever Experience changes"</text>
<rect x="560" y="48" width="512" height="96" rx="8" fill="#151922" stroke="#2c3340"/>
<circle cx="576" cy="68" r="10" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="576" y="72" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">B</text>
<text x="594" y="73" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Starting values</text>
<text x="574" y="96" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">InitializeBaseAttributes:</text>
<text x="574" y="114" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">growth rates · MaxLevel = curve keys · Level = 1</text>
<text x="574" y="132" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">then ExperienceUpdated() once → sets the XP gauge target</text>
<g transform="translate(0,-16)">
<rect x="10" y="186" width="1080" height="404" rx="12" fill="rgba(255,255,255,0.015)" stroke="#d9a441" stroke-opacity="0.45"/>
<text x="28" y="210" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">EVERY TIME XP IS EARNED (server)</text>
<rect x="28" y="222" width="330" height="100" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="44" cy="242" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="44" y="246" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1a</text>
<text x="62" y="247" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Kill</text>
<text x="42" y="270" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">GAP_Dead → RewardEffect</text>
<text x="42" y="288" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">SetByCaller: XP + souls</text>
<text x="42" y="306" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">shared with allies within 10 m</text>
<rect x="28" y="336" width="330" height="84" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="44" cy="356" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="44" y="360" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1b</text>
<text x="62" y="361" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Stand in a flag zone</text>
<text x="42" y="384" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">AFlag::Tick → ApplyModToAttribute</text>
<text x="42" y="402" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">+50 XP every 8 seconds</text>
<rect x="392" y="270" width="300" height="100" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="408" cy="290" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="408" y="294" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">2</text>
<text x="426" y="295" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Experience changes</text>
<text x="406" y="318" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">the subscription from A fires</text>
<text x="406" y="336" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">→ ExperienceUpdated(ChangeData)</text>
<text x="406" y="354" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">ChangeData.NewValue = total XP</text>
<path d="M360 272 L390 300" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<path d="M360 378 L390 345" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<rect x="726" y="222" width="346" height="152" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="742" cy="242" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="742" y="246" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">3</text>
<text x="760" y="247" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Work out the level</text>
<text x="740" y="270" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">ExperienceUpdated</text>
<text x="740" y="288" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">server only · stops at max level</text>
<text x="740" y="306" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">first threshold above total XP</text>
<text x="740" y="324" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">   decides the new level</text>
<text x="740" y="342" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">points += NewLevel − CurrentLevel</text>
<text x="740" y="360" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">set Level, Prev/Next XP, UpgradePoint</text>
<path d="M694 320 L724 300" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<rect x="726" y="392" width="346" height="84" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="742" cy="412" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="742" y="416" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">4</text>
<text x="760" y="417" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Stats grow by themselves</text>
<text x="740" y="440" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">MMC_LevelBased watches Level live:</text>
<text x="740" y="458" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">bonus = (Level − 1) × GrowthRate</text>
<path d="M899 376 L899 390" fill="none" stroke="#d9a441" stroke-width="2" marker-end="url(#hd9a441)"/>
<rect x="28" y="476" width="664" height="96" rx="8" fill="#151922" stroke="#d9822b"/>
<circle cx="44" cy="496" r="10" fill="none" stroke="#d9822b" stroke-width="1.5"/>
<text x="44" y="500" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="62" y="501" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Server_UpgradeAbilityWithID(InputID)</text>
<text x="42" y="524" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">find the ability record (spec) · not level 4 · cost = Level + 1 · enough points?</text>
<text x="42" y="542" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">UpgradePoint −= cost · Spec->Level += 1 · MarkAbilitySpecDirty</text>
<text x="42" y="560" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">refused → just returns, nothing sent back</text>
<rect x="10" y="602" width="1080" height="146" rx="12" fill="rgba(255,255,255,0.015)" stroke="#5fa8ff" stroke-opacity="0.45"/>
<text x="28" y="626" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">ON THE OWNING CLIENT</text>
<rect x="28" y="636" width="330" height="100" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="44" cy="656" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="44" y="660" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5</text>
<text x="62" y="661" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Shown on the HUD</text>
<text x="42" y="684" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">Level, XP, points replicate</text>
<text x="42" y="702" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">→ XP gauge, level number,</text>
<text x="42" y="720" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">   points to spend</text>
<rect x="392" y="636" width="300" height="100" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="408" cy="656" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="408" y="660" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5b</text>
<text x="426" y="661" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Press upgrade</text>
<text x="406" y="684" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">UpgradeAbilityWithInputID</text>
<text x="406" y="702" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">→ Server RPC to step 6</text>
<rect x="726" y="636" width="346" height="100" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="742" cy="656" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="742" y="660" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">7</text>
<text x="760" y="661" font-size="14" fill="#e6e8ee" font-weight="600" text-anchor="start">Upgrade arrives</text>
<text x="740" y="684" font-size="11" fill="#e9c46a" font-weight="500" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">Client_AbilitySpecLevelUpdated</text>
<text x="740" y="702" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">level set now · notches update</text>
<text x="740" y="720" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">(delegate) · upgrade sound plays</text>
<path d="M899 478 L899 506 L694 506" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<text x="905" y="500" font-size="11" fill="#9aa3b2" font-weight="600" text-anchor="start">level up gives points</text>
<path d="M193 574 L193 634" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="200" y="610" font-size="11" fill="#5fa8ff" font-weight="600" text-anchor="start">replication</text>
<path d="M542 634 L542 574" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="550" y="610" font-size="11" fill="#5fa8ff" font-weight="600" text-anchor="start">Server RPC</text>
<path d="M694 540 L899 540 L899 634" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#hd9822b)"/>
<text x="905" y="610" font-size="11" fill="#d9822b" font-weight="600" text-anchor="start">Client RPC + replication</text>
</g>
</svg>