<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="GAS foundations in ten numbered steps. On every machine: 1 the character constructor creates the Ability System Component and attribute sets. On the server: 2 OnPossess or PossessedBy, 3 InitAbilityActorInfo, 4 InitializeBaseAttributes from the data table, 5 ApplyInitialEffects, 6 GiveInitialAbilities. On the owning client: 7 AcknowledgePossession calls ClientSideInit, 8 InitAbilityActorInfo, 9 HandleAbilityInput, 10 AbilityLocalInputPressed finds the ability with that input ID.">
<defs><marker id="h9aa3b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker><marker id="hd9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/></marker><marker id="h5fa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5fa8ff"/></marker></defs>
<rect width="100%" height="100%" fill="#0d0f14"/>
<rect x="8" y="14" width="1034" height="130" rx="12" fill="rgba(255,255,255,0.015)" stroke="#9aa3b2" stroke-opacity="0.4"/>
<text x="26" y="38" font-size="12.5" fill="#9aa3b2" font-weight="700" text-anchor="start">EVERY MACHINE</text>
<text x="146.6" y="38" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">the same character class on the server and every client</text>
<rect x="18" y="46" width="188" height="80" rx="8" fill="#151922" stroke="#2c3340"/>
<circle cx="34" cy="66" r="10" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="34" y="70" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">1</text>
<text x="121.0" y="71" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Character built</text>
<text x="112.0" y="92" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">CreateDefaultSubobject</text>
<text x="112.0" y="111" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">ASC + attribute sets</text>
<text x="238" y="76" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">Every hero and minion gets its own Ability System Component and</text>
<text x="238" y="94" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">combat attribute set in the constructor. Player characters also get</text>
<text x="238" y="112" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">the hero attribute set (XP, level, souls, upgrade points).</text>
<rect x="8" y="156" width="1034" height="168" rx="12" fill="rgba(255,255,255,0.015)" stroke="#d9a441" stroke-opacity="0.4"/>
<text x="26" y="180" font-size="12.5" fill="#d9a441" font-weight="700" text-anchor="start">ON THE SERVER</text>
<text x="146.6" y="180" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">decides everything</text>
<rect x="18" y="214" width="188" height="80" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="34" cy="234" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="34" y="238" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">2</text>
<text x="121.0" y="239" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Possessed</text>
<text x="112.0" y="260" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">OnPossess · PossessedBy</text>
<text x="112.0" y="279" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">player · AI minion</text>
<rect x="222" y="214" width="188" height="80" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="238" cy="234" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="238" y="238" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">3</text>
<text x="325.0" y="239" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Wire it up</text>
<text x="316.0" y="260" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">InitAbilityActorInfo</text>
<text x="316.0" y="279" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">owner + body = this</text>
<rect x="426" y="214" width="188" height="80" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="442" cy="234" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="442" y="238" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">4</text>
<text x="529.0" y="239" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Base stats</text>
<text x="520.0" y="260" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">InitializeBaseAttributes</text>
<text x="520.0" y="279" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">this hero's data table row</text>
<rect x="630" y="214" width="188" height="80" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="646" cy="234" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="646" y="238" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">5</text>
<text x="733.0" y="239" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Initial effects</text>
<text x="724.0" y="260" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">ApplyInitialEffects</text>
<text x="724.0" y="279" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">from the shared data asset</text>
<rect x="834" y="214" width="188" height="80" rx="8" fill="#151922" stroke="#d9a441"/>
<circle cx="850" cy="234" r="10" fill="none" stroke="#d9a441" stroke-width="1.5"/>
<text x="850" y="238" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">6</text>
<text x="937.0" y="239" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Give abilities</text>
<text x="928.0" y="260" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">GiveInitialAbilities</text>
<text x="928.0" y="279" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">heavy L0 · light L1 · passive</text>
<path d="M208 254.0 L219 254.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M412 254.0 L423 254.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M616 254.0 L627 254.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M820 254.0 L831 254.0" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<path d="M112.0 128 L112.0 211" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#h9aa3b2)"/>
<rect x="8" y="336" width="1034" height="170" rx="12" fill="rgba(255,255,255,0.015)" stroke="#5fa8ff" stroke-opacity="0.4"/>
<text x="26" y="360" font-size="12.5" fill="#5fa8ff" font-weight="700" text-anchor="start">ON THE OWNING CLIENT</text>
<text x="204.0" y="360" font-size="11.5" fill="#9aa3b2" font-weight="400" text-anchor="start">players only</text>
<rect x="18" y="394" width="188" height="80" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="34" cy="414" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="34" y="418" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">7</text>
<text x="121.0" y="419" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Possession arrives</text>
<text x="112.0" y="440" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">AcknowledgePossession</text>
<text x="112.0" y="459" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">→ ClientSideInit</text>
<rect x="222" y="394" width="188" height="80" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="238" cy="414" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="238" y="418" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">8</text>
<text x="325.0" y="419" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Wire it up</text>
<text x="316.0" y="440" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">InitAbilityActorInfo</text>
<text x="316.0" y="459" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">its own copy of the ASC</text>
<rect x="426" y="394" width="188" height="80" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="442" cy="414" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="442" y="418" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">9</text>
<text x="529.0" y="419" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Press a key</text>
<text x="520.0" y="440" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">HandleAbilityInput</text>
<text x="520.0" y="459" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">Enhanced Input → InputID</text>
<rect x="630" y="394" width="188" height="80" rx="8" fill="#151922" stroke="#5fa8ff"/>
<circle cx="646" cy="414" r="10" fill="none" stroke="#5fa8ff" stroke-width="1.5"/>
<text x="646" y="418" font-size="10.5" fill="#e6e8ee" font-weight="700" text-anchor="middle">10</text>
<text x="733.0" y="419" font-size="13.5" fill="#e6e8ee" font-weight="600" text-anchor="middle">Find the ability</text>
<text x="724.0" y="440" font-size="10.5" fill="#e9c46a" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">AbilityLocalInputPressed</text>
<text x="724.0" y="459" font-size="11" fill="#9aa3b2" font-weight="400" text-anchor="middle">the spec with that InputID</text>
<text x="844" y="420" font-size="12" fill="#9aa3b2" font-weight="600" text-anchor="start">The server has the final</text>
<text x="844" y="438" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">say on cost, cooldown and</text>
<text x="844" y="456" font-size="12" fill="#9aa3b2" font-weight="400" text-anchor="start">whether it activates.</text>
<path d="M208 434.0 L219 434.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<path d="M412 434.0 L423 434.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<path d="M616 434.0 L627 434.0" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<path d="M152.0 296 L152.0 391" fill="none" stroke="#5fa8ff" stroke-width="2" marker-end="url(#h5fa8ff)"/>
<text x="162.0" y="316" font-size="11.5" fill="#5fa8ff" font-weight="600" text-anchor="start">possession replicates to that player</text>
</svg>