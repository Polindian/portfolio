<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 676" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Team journey in thirteen numbered steps. Lobby: click a slot, request it with a Server RPC, the Game State array updates, every lobby redraws, and your Player State keeps a copy. Travel: seamless travel and CopyProperties carry the copy to a new Player State. Arena: the slot becomes team 0 or 1, is set on the controller, picks a start spot, is copied to the hero, and replicates so every PC colours health bars; everything else asks for the team. The table below lists every function.">
