<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 670" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="Team journey. In the lobby a slot click becomes a Server RPC, updates the Game State array, redraws every lobby and is copied to your Player State. On travel CopyProperties carries it to a new Player State. In the arena the slot becomes team 0 or 1, is set on the controller, picks a start spot, is copied to the hero, and replicates so every PC colours health bars.">
